name: Import preserved Stage 0 history

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Restore exact foundation commit object
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          expected = "7a66c1228dc7aff73ca758b0761b8cbae14a3657"
          payload = {
              "tree": "d6ae3cc0977b4f37e1e1d65876f1ddeb72e602b8",
              "parents": [],
              "author": {"name": "Codex", "email": "codex@openai.com", "date": "2026-10-06T19:31:19-07:00"},
              "committer": {"name": "Codex", "email": "codex@openai.com", "date": "2026-10-06T19:31:19-07:00"},
              "message": "Build Stage 0 Marriott planner foundation\n",
          }
          url = "https://api.github.com/repos/" + os.environ["GH_REPOSITORY"] + "/git/commits"
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          for message in [payload["message"], payload["message"].rstrip("\n")]:
              payload["message"] = message
              request = urllib.request.Request(url, data=json.dumps(payload).encode(), headers=headers, method="POST")
              with urllib.request.urlopen(request) as response:
                  result = json.load(response)
              print("Imported root commit:", result["sha"])
              if result["sha"] == expected:
                  print("PASS: original Stage 0 commit SHA preserved exactly.")
                  break
          else:
              raise SystemExit("Imported SHA mismatch; no branch has been changed.")
          PY
